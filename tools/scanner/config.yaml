# Competitive Intelligence Scanner Configuration
# Adapted from Tubi Radar multi-agent architecture

global:
  lookback_hours: 72
  max_articles_per_feed: 25
  feed_timeout: 15
  max_concurrent_feeds: 10
  min_relevance_score: 4.0
  min_impact_score: 4.0
  enable_web_search: true
  models:
    reasoning: "gpt-4o"
    fast: "gpt-4o-mini"
    embedding: "text-embedding-3-small"

# Our company
tubi:
  id: tubi
  name: "Tubi"
  channel_count: 340
  feeds:
    - label: tubi_google_news
      url: "https://news.google.com/rss/search?q=Tubi+streaming"
    - label: tubi_press
      url: "https://news.google.com/rss/search?q=Tubi+TV+linear+channels"
    - label: tubi_fox
      url: "https://news.google.com/rss/search?q=Tubi+Fox+Sports"
  search_queries:
    - "Tubi streaming news 2025 2026"
    - "Tubi linear channels update"
    - "Tubi Fox Sports partnership"
    - "Tubi Super Bowl streaming"
    - "Tubi new channels launch"

