[project]
name = "linear-data"
version = "1.0.0"
description = "Databricks query CLI for Tubi Linear TV data analysis"
requires-python = ">=3.10"
dependencies = [
    "databricks-sql-connector>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
]

[project.scripts]
linear-query = "linear_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
